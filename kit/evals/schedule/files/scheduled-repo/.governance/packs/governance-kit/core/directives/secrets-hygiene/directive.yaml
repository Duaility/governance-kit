category: Foundation
recommended: true
summary: No credentials in tracked files.
surface: repo-state
hook: pre-commit
triggers: [pre-commit, schedule]
config:
  - name: SCHEDULE_CMD
    type: scalar
    doc: Consumer-selected scheduled judge command.
    default: claude -p --output-format text --model opus
    tunable: true
  - name: SCHEDULE_CRON
    type: scalar
    doc: Consumer-selected cron cadence; empty disables enrollment.
    default: ""
    tunable: true
