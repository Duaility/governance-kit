# governance-kit:managed kit-version=0.13.0
name: Governance sweep

# The at-rest lane of the kit's ONE judgment primitive. The same `judge:`
# declaration the commit gate reads is re-adjudicated here, off the commit path,
# through the judge command resolved from the repo-level `GOVERNANCE_SWEEP_CMD`
# knob — the same harness CLI that authors this repo's code. Judges never block
# where they run: this workflow files adjudication rounds and one digest issue;
# the existing `gate: verdict` gate is what turns a REFUTED into a red PR.
#
# HARNESS-PEGGED, BY DESIGN: the kit ships the lane, the consumer brings the
# judge and its credentials. There is no zero-secret judge, because a keyword
# stub is not a judge and a vendor inference endpoint is not the harness.
# Bundled directives declare no command of their own — the sweep driver
# resolves the judge for every directive from this workflow's exported
# `GOVERNANCE_SWEEP_CMD` (a repo-level knob, not a per-directive setting).
# This workflow's job is to make sure that CLI, its credential, and the
# `GOVERNANCE_SWEEP_CMD` env var are on the runner before `sweep.sh run`
# resolves it. With the lane not opted in, this workflow says so in one line
# and exits 0 — it never fakes an adjudication.
#
# To turn it on:
#   1. Repository variable  GOVERNANCE_SWEEP_ENABLED = true
#   2. Repository secret    ANTHROPIC_API_KEY         (the credential the
#      installed `claude` CLI needs)
#   3. Repository variable  GOVERNANCE_SWEEP_CMD       (optional — the judge
#      command; defaults to a `claude` CLI invocation below if unset)

on:
  schedule:
    # Daily at 07:00 UTC. Adjust to taste; the driver resumes from the last
    # digest's end-sha, so cadence only changes how much each run covers.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      range:
        description: "Explicit A..B commit range (overrides the resume point)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: governance-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # Full history so the driver can resolve the commit range it sweeps.
          fetch-depth: 0

      - name: Install harness CLI
        env:
          SWEEP_ENABLED: ${{ vars.GOVERNANCE_SWEEP_ENABLED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${SWEEP_ENABLED:-}" != "true" ]; then
            echo "governance sweep: no GOVERNANCE_SWEEP_ENABLED=true repository variable — the lane is not opted in, nothing will be adjudicated"
            exit 0
          fi
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "governance sweep: GOVERNANCE_SWEEP_ENABLED is set but no ANTHROPIC_API_KEY secret is set — nothing will be adjudicated"
            exit 0
          fi
          # The default GOVERNANCE_SWEEP_CMD (below) invokes the claude CLI;
          # install it here so that command resolves on the runner. A repo
          # that overrides GOVERNANCE_SWEEP_CMD to a different CLI (e.g. a
          # codex invocation) installs and credentials that CLI here instead —
          # this step only needs to satisfy whatever command the exported
          # GOVERNANCE_SWEEP_CMD actually names.
          npm install -g @anthropic-ai/claude-code

      - name: Run governance sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # gh CLI (resume point, dedupe, digest filing) uses the workflow token.
          GH_TOKEN: ${{ github.token }}
          SWEEP_RANGE_INPUT: ${{ github.event.inputs.range }}
          # The repo-level judge command knob. Falls back to a `claude` CLI
          # invocation (the CLI installed above) when no repo variable is set —
          # no bundled directive declares a command of its own any more.
          GOVERNANCE_SWEEP_CMD: ${{ vars.GOVERNANCE_SWEEP_CMD || 'claude -p --output-format text --model opus' }}
        run: |
          # sweep.sh resolves each participating directive's judge command
          # from the GOVERNANCE_SWEEP_CMD env var exported above (falling back
          # to a directive's own cmd.sweep only if it declares one).
          if [ -n "${SWEEP_RANGE_INPUT:-}" ]; then
            bash .governance/sweep.sh run --range "$SWEEP_RANGE_INPUT"
          else
            bash .governance/sweep.sh run
          fi
