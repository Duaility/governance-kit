# governance-kit:managed kit-version=0.13.0
name: Governance schedule[__LANE__]

# The at-rest lane of the kit's ONE judgment primitive. The same `judge:`
# declaration the commit gate reads is re-adjudicated here, off the commit
# path, through the judge command resolved from this workflow's own
# `GOVERNANCE_JUDGE_CMD` env — the same harness CLI that authors this repo's
# code. Judges never block where they run: this workflow files adjudication
# rounds and one digest issue per lane; the existing `gate: verdict` gate is
# what turns a REFUTED into a red PR the next time that section is touched.
#
# Mechanical `check.sh` members are different: their failures fail THIS job
# directly (facts fail jobs, judgments file issues) — a scheduled lane is not
# a softer version of the commit gate, it is the same enforcement re-run over
# whatever the cadence accumulated since the last run.
#
# THE WORKFLOW IS THE CONFIG. This file is generated by `governance schedule`
# (never hand-edited — `managed-tree-integrity` digests it) and names its own
# lane, cadence, and member directives explicitly; nothing coordinates
# multiple lanes beyond each carrying its own file. A directive must declare
# itself schedule-eligible (`triggers: [..., schedule]` in its directive.yaml,
# or a consumer overlay override) before `governance schedule` will accept it
# as a member here — see SCHEDULE_FLOW.md.
#
# HARNESS-PEGGED, BY DESIGN: the kit ships the lane, the consumer brings the
# judge and its credentials. There is no zero-secret judge, because a keyword
# stub is not a judge and a vendor inference endpoint is not the harness.
# Bundled directives declare no command of their own — the runner resolves
# the judge for every member from this workflow's exported
# `GOVERNANCE_JUDGE_CMD` (a per-lane knob, not a per-directive setting; a
# directive's own rare `judge.cmd.schedule` override still wins first). This
# workflow's job is to make sure that CLI, its credential, and the
# `GOVERNANCE_JUDGE_CMD` env var are on the runner before `run.sh --scheduled`
# resolves it. With the lane not opted in, this workflow says so in one line
# and exits 0 — it never fakes an adjudication. Mechanical members still run
# either way, and still fail the job on a genuine failure.
#
# To turn it on:
#   1. Repository variable  GOVERNANCE_SCHEDULE_ENABLED = true
#   2. Repository secret    ANTHROPIC_API_KEY          (the credential the
#      installed `claude` CLI needs — skip if this lane has no judge members)
#   3. Repository variable  GOVERNANCE_JUDGE_CMD        (optional — the judge
#      command; defaults to a `claude` CLI invocation below if unset)

on:
  schedule:
    - cron: "__CRON__"
  workflow_dispatch:
    inputs:
      range:
        description: "Explicit A..B commit range (overrides the resume point)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: governance-schedule-__LANE__
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # Full history so the driver can resolve the commit range it covers.
          fetch-depth: 0

      - name: Install harness CLI
        env:
          SCHEDULE_ENABLED: ${{ vars.GOVERNANCE_SCHEDULE_ENABLED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${SCHEDULE_ENABLED:-}" != "true" ]; then
            echo "governance schedule[__LANE__]: no GOVERNANCE_SCHEDULE_ENABLED=true repository variable — the lane is not opted in for judgment, but mechanical members still run below"
          fi
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "governance schedule[__LANE__]: no ANTHROPIC_API_KEY secret — judge members will skip honestly; mechanical members still run and can still fail this job"
          fi
          # The default GOVERNANCE_JUDGE_CMD (below) invokes the claude CLI;
          # install it here so that command resolves on the runner even when
          # the two guards above are unmet — a member with a rare
          # judge.cmd.schedule override naming a different CLI installs and
          # credentials that CLI itself, but this default install is harmless
          # either way.
          npm install -g @anthropic-ai/claude-code

      - name: Run governance schedule[__LANE__]
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # gh CLI (resume point, dedupe, digest filing) uses the workflow token.
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_RANGE_INPUT: ${{ github.event.inputs.range }}
          # This lane's judge command knob. Falls back to a `claude` CLI
          # invocation (the CLI installed above) when no repo variable is set
          # — a member directive's own judge.cmd.schedule override, when it
          # has one, still wins first.
          GOVERNANCE_JUDGE_CMD: ${{ vars.GOVERNANCE_JUDGE_CMD || 'claude -p --output-format text --model opus' }}
          GOVERNANCE_SCHEDULE_BUDGET: "__BUDGET__"
        run: |
          if [ -n "${SCHEDULE_RANGE_INPUT:-}" ]; then
            bash .governance/run.sh --scheduled --lane __LANE__ --evidence __EVIDENCE__ --range "$SCHEDULE_RANGE_INPUT" __MEMBERS__
          else
            bash .governance/run.sh --scheduled --lane __LANE__ --evidence __EVIDENCE__ __MEMBERS__
          fi
