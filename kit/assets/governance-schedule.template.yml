# governance-kit:managed kit-version=0.13.0
name: Governance schedule

# This is a compiled artifact of directive-owned scheduling. The source of
# truth is each installed directive's SCHEDULE_CRON config entry; this one
# workflow carries every distinct cadence and dispatches the matching members.
# `governance workflow generate` is the only writer. Never hand-edit this file:
# managed-tree-integrity records its digest offline.
#
# The same `judge:` declaration is used by the commit gate and the at-rest
# scheduled driver. Mechanical check.sh members fail the job directly; judge
# results are recorded in receipts or the schedule digest issue.
#
# To turn judge execution on, configure the repository variable
# GOVERNANCE_SCHEDULE_ENABLED=true and provide ANTHROPIC_API_KEY for the
# bundled claude-based SCHEDULE_CMD declarations. Missing credentials are
# reported honestly; they never become a guessed PASS.

on:
  schedule:
__CRON_ENTRIES__
  workflow_dispatch:
    inputs:
      cron:
        description: "Run one generated cadence; leave blank to run all"
        required: false
        type: string
      range:
        description: "Explicit A..B commit range (overrides each cadence's resume point)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: governance-schedule
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6afe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0

      - name: Install harness CLI
        env:
          SCHEDULE_ENABLED: ${{ vars.GOVERNANCE_SCHEDULE_ENABLED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${SCHEDULE_ENABLED:-}" != "true" ]; then
            echo "governance schedule: no GOVERNANCE_SCHEDULE_ENABLED=true repository variable — judge members will be reported un-adjudicated, while mechanical members still run"
          fi
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "governance schedule: no ANTHROPIC_API_KEY secret — judge members will skip honestly; mechanical members still run and can still fail this job"
          fi
          npm install -g @anthropic-ai/claude-code

      - name: Run governance schedule
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_EVENT: ${{ github.event.schedule }}
          SCHEDULE_INPUT: ${{ github.event.inputs.cron }}
          SCHEDULE_RANGE_INPUT: ${{ github.event.inputs.range }}
        run: |
__DISPATCH_SCRIPT__
