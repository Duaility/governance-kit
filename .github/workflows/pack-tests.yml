name: Pack tests

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  pack-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Run pack-author test suite
        run: bash scripts/test-packs.sh
