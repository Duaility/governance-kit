name: Pack tests

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  pack-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run pack-author test suite
        run: bash scripts/test-packs.sh
