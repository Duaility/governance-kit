name: Dogfood smoke (Lane 2)

# Lane 2 of the two-lane dogfood (issue #200). The committed `.governance/`
# (Lane 1) is an honest customer of the *last release* — its lock pins real tags
# and its consumed tree only moves in post-release `governance pack update` PRs,
# so it lags `packs/` by one release. This job closes the dev-loop gap: it
# materializes a consumed tree from the working tree's `packs/` (HEAD) against a
# throwaway copy of this repo and runs the suite, so "my new/edited directive in
# packs/ breaks our own repo" surfaces in the *same* PR — as ephemeral CI
# output, nothing committed. See scripts/dogfood-smoke.sh for the exact scope.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dogfood-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: Materialize consumed tree from HEAD packs/ and run the suite
        run: bash scripts/dogfood-smoke.sh
