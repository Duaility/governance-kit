name: Governance

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so git-grep-based directives can inspect all tracked files.
          fetch-depth: 0

      - name: Run bash governance directives
        if: hashFiles('.governance/run.sh') != ''
        run: bash .governance/run.sh

      # ─── Native test runners (remove any that don't apply to this repo) ───

      - name: Set up Python
        if: hashFiles('.governance/test_*.py') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run pytest governance directives
        if: hashFiles('.governance/test_*.py') != ''
        run: |
          python -m pip install --upgrade pip pytest
          pytest .governance -q

      - name: Set up Node
        if: hashFiles('.governance/*.test.*') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Run jest/vitest governance directives
        if: hashFiles('.governance/*.test.*') != ''
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          npx jest .governance 2>/dev/null || npx vitest run .governance

      - name: Set up Go
        if: hashFiles('.governance/*_test.go') != ''
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run go test governance directives
        if: hashFiles('.governance/*_test.go') != ''
        run: go test ./.governance/...
