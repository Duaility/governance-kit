# governance-kit:managed kit-version=0.7.2
name: Governance

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # Full history so git-grep-based directives can inspect all tracked files.
          fetch-depth: 0

      - name: Run bash governance directives
        # Directive trees are committed (vendored) under .governance/packs/, so
        # the runner sees them directly — no reconcile/fetch step, exactly like a
        # consumer repo. This repo is a protected consumer of its own product:
        # the consumed tree is pinned at released tags and moves only in
        # post-release `governance pack update` / `governance update` PRs, never
        # hand-edited (`managed-tree-integrity`, with `consumed-tree-integrity`
        # during the transition, enforces that). Directive changes in packs/ are
        # exercised against this repo by each directive's own evals in tests.yml.
        run: bash .governance/run.sh

      # The kit-internal test umbrella (scripts/test.sh) runs in tests.yml so
      # this workflow stays focused on directive enforcement.
