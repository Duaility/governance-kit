# governance-kit:managed kit-version=0.7.0
name: Governance

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # Full history so git-grep-based directives can inspect all tracked files.
          fetch-depth: 0

      - name: Run bash governance directives
        # Directive trees are committed (vendored) under .governance/packs/, so
        # the runner sees them directly — no reconcile/fetch step, exactly like a
        # consumer repo. This is Lane 1 of the dogfood (issue #200): an honest
        # customer pinned at released tags. The consumed tree moves only in
        # post-release `governance pack update` PRs — never hand-edited (the
        # `consumed-tree-integrity` directive enforces that). Directive changes
        # in packs/ are smoke-tested against this repo by Lane 2 (dogfood-smoke.yml).
        run: bash .governance/run.sh

      # The kit-internal test umbrella (scripts/test.sh) runs in tests.yml so
      # this workflow stays focused on directive enforcement.
