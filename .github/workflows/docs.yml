name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - scripts/docs-site/**
      - .github/workflows/docs.yml
      - package.json
  pull_request:
    paths:
      - docs/**
      - scripts/docs-site/**
      - .github/workflows/docs.yml
      - package.json
  workflow_dispatch:

# GitHub Pages deploy needs pages:write + id-token:write; everything else is read-only.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Project Pages serve under https://<owner>.github.io/<repo>/ — build with that base.
  # For a user/org root site or custom domain, set BASE_PATH to "" and ORIGIN to the domain.
  BASE_PATH: /governance-kit
  ORIGIN: https://duaility.github.io/governance-kit

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: Build docs site
        run: npm run docs:build
        env:
          DOCS_SITE_BASE_PATH: ${{ env.BASE_PATH }}
          DOCS_SITE_CANONICAL_ORIGIN: ${{ env.ORIGIN }}
      - run: npm run docs:smoke
        env:
          DOCS_SITE_BASE_PATH: ${{ env.BASE_PATH }}
          DOCS_SITE_CANONICAL_ORIGIN: ${{ env.ORIGIN }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: dist/docs-site

  deploy:
    # Deploy only from main; PRs just build to validate.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
