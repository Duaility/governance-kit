# .governance/integrity.conf
#
# Documents the `doc-integrity` directive protects in this repo. One rule per
# line; blank lines and '#' comments ignored. Integrity is measured against the
# default-branch merge-base, so the current branch's own in-flight content stays
# editable until it merges — only what is already on the trunk is frozen.
#
# Rules: `<mode> <path> [arg]`
#   frozen-files   <glob>            files immutable once on the trunk; new files OK
#   append-only    <file>            baseline must be a byte-prefix of current
#   frozen-section <file> <heading>  baseline lines under the heading survive verbatim
#
# Reviewed-rewrite waiver: `governance: allow-doc-integrity <path> <reason>` in
# the commit body.

# Per-issue audit traces — a past receipt is evidence of what was true then.
frozen-files    receipts/*.md

# Agent accounting ledgers — only ever grow at the bottom.
append-only     COSTS.md
append-only     STEERING.md

# Resolved issues are historical fact; the Open worklist stays free.
frozen-section  QUALITY.md         Resolved

# Constitutional amendments: "append, do not rewrite history."
frozen-section  CONSTITUTION.md    Evolution Log
