# Path-glob waivers for no-package-manager (duaility/governance-kit).
# Repo-local dogfood pack: this file is hand-authored, not materialized from a
# release pin. It ships with zero live rows by design — the directive is
# absolute out of the box, because nothing governance-kit ships needs a package
# manager. Per-repo overrides go in the overlay at
# `.governance/conf/duaility/governance-kit/no-package-manager.conf`:
#
#   <path-glob>     a bare line EXEMPTS a path from the scan
#   !<path-glob>    un-exempts one of the (currently empty) defaults below
#
# Matching: a trailing `/` means directory prefix, a pattern containing `/`
# is matched against the full path, otherwise it matches the basename.
# Irrelevant patterns simply never match.
#
# Scanned set (the shipped trees — see check.sh): tracked `*.sh` / `*.py` /
# `*.yml` / `*.yaml` under `kit/`, `packs/` and `skill/`, plus every
# `.githooks/*` dispatcher.
#
# Out of scope on purpose, and not expressible as a waiver row:
#   .github/workflows/**            the docs site is a real npm project and
#                                   docs.yml builds it — the kit ships none of it
#   scripts/**                      this repo's test harness; it never ships
#   packs/*/directives/*/evals/**   fixtures, stripped by the materializer, and
#                                   full of deliberate violation strings
#   .governance/**                  vendored from the last release, one cycle
#                                   behind the source trees by design
