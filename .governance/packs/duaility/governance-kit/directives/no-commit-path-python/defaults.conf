# Path-glob waivers for no-commit-path-python (duaility/governance-kit).
# Repo-local dogfood pack: this file is hand-authored, not materialized from a
# release pin. It ships with zero live rows by design — the directive is
# absolute out of the box, because the commit path governance-kit authors for
# every consumer needs nothing but bash + git. Per-repo overrides go in the
# overlay `.governance/conf/duaility/governance-kit/no-commit-path-python.conf`:
#
#   <path-glob>     a bare line EXEMPTS a path from the scan
#   !<path-glob>    un-exempts one of the (currently empty) defaults below
#
# Matching: a trailing `/` means directory prefix, a pattern containing `/`
# is matched against the full path, otherwise it matches the basename.
# Irrelevant patterns simply never match.
#
# Scanned set (the SOURCE commit path this repo authors — see check.sh):
#   kit/assets/dot-governance/lib.sh
#   kit/assets/dot-governance/run.sh
#   kit/assets/dot-governance/runtimes/*.sh
#   packs/*/directives/*/check.sh
#   packs/*/directives/*/hooks/*.sh
#   packs/*/directives/*/runtimes/*.sh
#   .githooks/*
#
# Out of scope on purpose: kit/assets/packs/lib/** (the lifecycle lane) is
# allowed python by issue #355's lane table — it is governed instead by the
# sibling stdlib-only-python. The sweep engine is bash
# (kit/assets/dot-governance/sweep.sh) as of the #355 sweep unification, so no
# sweep exemption exists here anymore. .governance/** is this repo's vendored
# last-release tree, which lags the source trees by one release by design.
