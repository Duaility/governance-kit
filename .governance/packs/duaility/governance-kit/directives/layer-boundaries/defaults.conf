# Default configuration for layer-boundaries (duaility/governance-kit).
# Pack-owned and live — `governance pack update` refreshes this file, so improved
# defaults reach every consumer. Do not hand-edit it; customize per-repo via the
# overlay `.governance/conf/duaility/governance-kit/layer-boundaries.conf`:
#
#   KEY=value      override a scalar (env GOVERNANCE_<KEY> still wins)
#
# LAYER_DOC — the document that declares this repo's layer / responsibility
# model. It is the ground truth a fresh-context sub-agent reads (alongside the
# diff) to judge whether a change honors the layering. In governance-kit this is
# the `## Layer map` in ARCHITECTURE.md, which the `architecture-map-holds`
# directive keeps honest about the tree. The directive is a NO-OP when this file
# does not exist, so a repo that has not declared its layers pays nothing.
LAYER_DOC=ARCHITECTURE.md
