# Effective stdlib allowlist for stdlib-only-python (duaility/governance-kit).
# Repo-local dogfood pack: this file is hand-authored, not materialized from a
# release pin. Per-repo overrides go in the overlay at
# `.governance/conf/duaility/governance-kit/stdlib-only-python.conf`:
#
#   <module>      a bare line ADDS an allowed root module (top-level package
#                 name only — `foo` covers `import foo.bar.baz` too)
#   !<module>     REMOVES one of the defaults below (e.g. a repo that wants
#                 to forbid ctypes)
#
# Only the ROOT module of an import is checked (`import os.path` → `os`,
# `from urllib.request import urlopen` → `urllib`). Two kinds of import are
# first-party and never appear in this list: relative imports
# (`from . import x`) and flat sibling imports whose root resolves to a `.py`
# file or package directory next to the importing file — that is how the kit's
# engines under `kit/assets/packs/lib/` reference each other.
#
# Scanned set (everything this repo SHIPS — see check.sh): `kit/**/*.py` and
# `skill/*.py`. `scripts/**` is out of scope on purpose (this repo's test
# harness never ships), as is the vendored `.governance/` tree (materialized
# from the last release, one cycle behind `kit/` by design).
#
# Example overlay lines (these live in your overlay, not here):
#   tomllib       # a repo pinned above Python 3.11 wants this explicitly named
#   !venv         # this repo forbids the venv module entirely
