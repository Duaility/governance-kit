# .governance/conf/doc-freshness.conf
#
# Rule lines are one path per line, relative to the repo root. Blank lines and
# lines starting with '#' are ignored. The `doc-freshness` directive checks that
# each listed file carries a recent `<!-- last-verified: YYYY-MM-DD -->` marker.
# If this file lists no paths, the directive is a no-op.
#
# Staleness window (days). Uncomment to change the default of 90. The
# GOVERNANCE_FRESHNESS_DAYS environment variable overrides this line.
# FRESHNESS_DAYS=90
#
# Examples (uncomment to opt in):
#
# ops/runbooks/incident-response.md
# services/api/README.md
# services/worker/DEPLOY.md
# docs/data-dictionary.md
