# .governance/conf/internal-doc-links.conf
#
# Opt-in config for the `reachable` sub-check of the `internal-doc-links`
# directive (the "no orphan docs" half). The `resolve` sub-check — no dead
# links — is always on and needs no config.
#
# If this file names no roots, `reachable` is a no-op. The `resolve` half still
# runs. One directive per line; blank lines and lines starting with '#' are
# ignored.
#
#   root <path>      An entry-point doc. Every tracked .md/.markdown file must be
#                    reachable by following internal links from at least one root.
#                    Declare one or more.
#   exclude <glob>   A tracked doc that is allowed to be unreachable (matched as a
#                    shell glob against the repo-relative path). Repeatable.
#
# A doc can also opt out inline with a comment in its first 10 lines:
#   governance: allow-internal-doc-links reachable <reason>
#
# Examples (uncomment and adjust to opt in):
#
# root AGENTS.md
# root README.md
# exclude docs/archive/*.md
