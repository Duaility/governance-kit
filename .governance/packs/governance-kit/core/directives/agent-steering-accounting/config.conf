# .governance/conf/agent-steering-accounting.conf
#
# Your overlay for the `agent-steering-accounting` directive. It layers on top
# of the pack-owned defaults (see the directive's defaults.conf — the lexical
# redirect-trigger phrases: no, stop, wait, actually, instead, don't, hold on,
# back up, undo, revert, that's wrong, you're wrong).
#
# Lexical trigger phrases (the CLI-down fallback list):
#
#   <phrase>      a bare line ADDS a redirect-trigger phrase
#   !<phrase>     drops one of the defaults (gitignore-style negation)
#
# Matching is case-insensitive, anchored at the start of the user message, on a
# word boundary. Multi-word phrases match verbatim. These only affect the
# silent lexical fallback used when the classifier CLI is unreachable — the CLI
# classifier subsumes this list under normal operation.
#
# Scalar overrides (env GOVERNANCE_<KEY> wins over a line here):
#
#   CANDIDATE_MAX_LEN=<int>   max user-message length (chars) still considered a
#                             classification candidate; longer messages are
#                             clipped before the CLI call. Default 2000. Raising
#                             it widens what the classifier inspects at some
#                             token cost; lowering it skips long messages.
#
# This file is yours — `governance pack update` never overwrites it. Deleting it
# falls back to the stock defaults.
#
# Examples (uncomment to use):
#
# scratch that         # also treat "scratch that ..." as a redirect
# rather              # ...and "rather, do X"
# !back up            # stop counting "back up" as a redirect trigger
# CANDIDATE_MAX_LEN=4000
