# agent-governance pack
#
# Rules for repos that operate under agent-driven development — where
# every change to the tree is produced through an agent runtime (Codex,
# Claude Code, Cursor, ...). These rules assume every commit has an
# issue anchor, a matching plan, and full cost accounting.
#
# The four rules form a chain: issues are tracked (`issues-tracked`),
# every issue has exactly one plan (`plan-per-issue`), every commit
# matches its plan (`commit-issue-plan-match`), and every commit carries
# its cost (`agent-token-accounting`). Breaking any link makes the
# chain non-auditable, so the `standard` preset bundles all four.
#
# Category `AgentDiscipline` is introduced by this pack — the
# bootstrap skill surfaces it as an additional screen when this pack
# is selected.
#
# Rule metadata and artefacts live inside each rule's folder under
# `rules/<id>/`. This file carries only pack-level identity and the
# presets that select rules by id.

id: duaility/agent-governance
name: Agent-governance rules
version: "0.1"
min_governance_kit: "0.2"
description: Rules for repos operating under agent-driven development.
author: governance-kit

presets:
  minimal:
    rules:
      - plan-per-issue
      - commit-issue-plan-match
  standard:
    extends: minimal
    rules:
      - issues-tracked
      - agent-token-accounting
  strict:
    extends: standard
    rules: []
