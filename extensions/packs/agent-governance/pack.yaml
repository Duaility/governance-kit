# agent-governance pack
#
# Directives for repos that operate under agent-driven development — where
# every change to the tree is produced through an agent runtime (Codex,
# Claude Code, Cursor, ...). These directives assume every commit has an
# issue template, an issue anchor, a matching receipt, and full cost accounting.
#
# The directives form a chain: issue creation uses a durable template
# (`issue-templates`), issues are tracked (`issues-tracked`), every issue
# has exactly one receipt (`receipt-per-issue`), every commit matches its
# receipt (`commit-issue-receipt-match`), and every commit carries its
# cost (`agent-token-accounting`). Breaking any link makes the chain
# non-auditable, so the `standard` preset bundles the full chain.
#
# Category `AgentDiscipline` is introduced by this pack — the
# bootstrap skill surfaces it as an additional screen when this pack
# is selected.
#
# Directive metadata and artefacts live inside each directive's folder under
# `directives/<id>/`. This file carries only pack-level identity and the
# presets that select directives by id.

id: duaility/agent-governance
name: Agent-governance directives
version: "0.2"
min_governance_kit: "0.2"
description: Directives for repos operating under agent-driven development.
author: governance-kit

presets:
  minimal:
    directives:
      - receipt-per-issue
      - pr-required-when-checklist-complete
      - commit-issue-receipt-match
  standard:
    extends: minimal
    directives:
      - issue-templates
      - issues-tracked
      - agent-token-accounting
  strict:
    extends: standard
    directives: []
