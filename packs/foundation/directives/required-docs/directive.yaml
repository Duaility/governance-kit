# required-docs — consolidated presence checks for repo-root artefacts and
# local-hook scaffolding (constitution, agents, readme, license, security,
# architecture, CI workflow, .env.example sync, githooks).
category: Foundation
recommended: true
summary: Baseline root-level docs and hook scaffolding exist.
surface: repo-state
hook: pre-commit
judge:
  inputs: [range-diff]
  checks:
    - "AGENTS.md genuinely functions as a map into the repo's durable docs — its links point to docs that actually cover what their surrounding text claims."
    - "README.md's heading and prose genuinely describe what the project is and does, not padding added only to clear the word-count floor."
    - "SECURITY.md's contact or disclosure channel is a real, usable channel, not a placeholder address."
    - "A per-sub-check waiver's reason genuinely explains why the repo doesn't need that document, not boilerplate to bypass required-docs wholesale."
  group: bundled-intent
