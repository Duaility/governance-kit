# .governance/conf/required-docs.conf
#
# Threshold tuning for the `required-docs` directive. `KEY=value` lines set a
# scalar; blank lines and lines starting with '#' are ignored. Each key can also
# be overridden by the matching `GOVERNANCE_<KEY>` environment variable, which
# wins over this file.
#
#   AGENTS_MD_MIN         Minimum line count for AGENTS.md (stub guard).
#   AGENTS_MD_MAX         Maximum line count for AGENTS.md (keep it an index, not a
#                         manual).
#   AGENTS_MD_MIN_LINKS   Minimum internal links AGENTS.md must carry.
#   ARCHITECTURE_MIN      Minimum line count for ARCHITECTURE.md.
#
# Defaults shown below — uncomment and edit a line to override:
# AGENTS_MD_MIN=30
# AGENTS_MD_MAX=250
# AGENTS_MD_MIN_LINKS=3
# ARCHITECTURE_MIN=20
