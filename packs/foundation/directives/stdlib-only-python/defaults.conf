# Effective stdlib allowlist for stdlib-only-python. Pack-owned and live —
# `governance pack update` refreshes this file, so a widened default reaches
# every consumer. Do not hand-edit it; customize per-repo via the overlay at
# `.governance/conf/governance-kit/foundation/stdlib-only-python.conf`:
#
#   <module>      a bare line ADDS an allowed root module (top-level package
#                 name only — `foo` covers `import foo.bar.baz` too)
#   !<module>     REMOVES one of the defaults below (e.g. a repo that wants
#                 to forbid ctypes)
#
# Only the ROOT module of an import is checked (`import os.path` → `os`,
# `from urllib.request import urlopen` → `urllib`). Relative imports
# (`from . import x`) are always allowed and never appear in this list.
#
# Example overlay lines (these live in your overlay, not here):
#   tomllib       # a repo pinned above Python 3.11 wants this explicitly named
#   !venv         # this repo forbids the venv module entirely
__future__
abc
argparse
base64
binascii
bisect
collections
contextlib
copy
csv
ctypes
dataclasses
datetime
difflib
enum
errno
fnmatch
functools
getpass
