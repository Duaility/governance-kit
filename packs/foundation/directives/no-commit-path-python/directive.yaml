# no-commit-path-python — the consumer commit path (lib.sh, run.sh, every
# check.sh / hooks/*.sh / runtimes/*.sh, and .githooks/*) invokes no python.
# Part of the issue #355 dependency-posture trio: a consumer repo needs
# nothing but bash + git to commit. Opt-in (strict preset only) — flipping it
# on for a repo whose installed directives still ship a python check.sh (a
# pre-#355 community pack, say) is a real, actionable failure, not a
# baseline everyone should eat unasked.
category: Foundation
recommended: false
summary: The commit path (lib.sh, check.sh, hooks, runtimes, .githooks) invokes no python.
surface: repo-state
hook: pre-commit
