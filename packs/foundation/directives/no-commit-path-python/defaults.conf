# Path-glob waivers for no-commit-path-python. Pack-owned and live —
# `governance pack update` refreshes this file. It ships with zero live rows
# by design: the directive is absolute out of the box (the commit path needs
# nothing but bash + git). Customize per-repo via the overlay at
# `.governance/conf/governance-kit/foundation/no-commit-path-python.conf`:
#
#   <path-glob>     a bare line EXEMPTS a path from the scan
#   !<path-glob>    un-exempts one of the (currently empty) defaults below
#
# Matching: a trailing `/` means directory prefix, a pattern containing `/`
# is matched against the full path, otherwise it matches the basename.
# Irrelevant patterns simply never match.
#
# Example overlay lines (these live in your overlay, not here):
#   .governance/packs/acme/legacy-pack/directives/*/runtimes/*.sh   # legacy pack knowingly ships python here (issue #123)
#   .githooks/pre-commit                                            # a vendored hook this repo can't yet change
