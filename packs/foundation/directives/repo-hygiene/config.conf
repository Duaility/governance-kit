# .governance/conf/repo-hygiene.conf
#
# Threshold tuning for the `repo-hygiene` directive. `KEY=value` lines set a
# scalar; blank lines and lines starting with '#' are ignored. Each key can also
# be overridden by the matching `GOVERNANCE_<KEY>` environment variable, which
# wins over this file.
#
#   MAX_FILE_SIZE_MB   Largest committed file allowed, in MB (no-large-files
#                      sub-check).
#   FILE_SIZE_LIMIT    Longest source file allowed, in lines (file-size-limit
#                      sub-check).
#
# Defaults shown below — uncomment and edit a line to override:
# MAX_FILE_SIZE_MB=5
# FILE_SIZE_LIMIT=500
