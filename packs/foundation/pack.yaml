# governance-kit foundation pack
#
# Repo scaffolding and kit coherence — the directives a governed repo needs
# before any concern-specific rule makes sense: the required documents exist,
# and the single kit-version pin agrees with every managed-file stamp.
#
# Directive metadata lives inside each directive's folder under
# `directives/<id>/` (`directive.yaml`, `check.sh`, `constitution.md`, and
# optional `config.conf` / `defaults.conf` / `evals/`). This file carries only
# pack-level identity and the presets that select directives by id. Presets are
# per-pack; `governance init` unions each pack's preset across the installed
# packs (see governance/references/INIT_FLOW.md).

id: governance-kit/foundation
name: Foundation governance directives
version: "0.1.0"
min_governance_kit: "0.3"
description: Repo scaffolding (required docs) and kit-version coherence.
author: governance-kit

presets:
  minimal:
    directives:
      - required-docs
  standard:
    extends: minimal
    directives:
      - kit-version-sync
  strict:
    extends: standard
    directives: []
