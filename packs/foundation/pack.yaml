# governance-kit foundation pack
#
# Kit coherence — the vendored `.governance/` tree matches the digests recorded
# at install/update time (`managed-tree-integrity`). Repo-document inventories,
# internal link graphs, and working-tree hygiene are not bundled here (issue
# #370); ecosystem linters and ordinary review own those concerns.
#
# Directive metadata lives inside each directive's folder under
# `directives/<id>/` (`directive.yaml`, `check.sh`, `constitution.md`, and
# optional config registry / `evals/`). This file carries only
# pack-level identity and the presets that select directives by id. Presets are
# per-pack; `governance init` unions each pack's preset across the installed
# packs (see kit/references/INIT_FLOW.md).
# RELEASE REMINDER: if these directives begin requiring a newer kit runtime,
# raise min_governance_kit in the release commit that first ships that runtime.
# Version is written only by scripts/release.sh.

id: governance-kit/foundation
name: Foundation governance directives
version: "0.7.0"
min_governance_kit: "0.6.0"
description: Managed-tree integrity for the vendored governance install.
author: governance-kit

presets:
  minimal:
    directives:
      - managed-tree-integrity
  standard:
    extends: minimal
    directives: []
  strict:
    extends: standard
    directives: []
