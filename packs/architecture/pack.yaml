# Pack identity + presets. Per-directive data lives in directive.yaml.

id: governance-kit/architecture
name: Architectural-shape governance directives
version: "0.2.1"
min_governance_kit: "0.9.0"
description: Semantic, LLM-adjudicated architectural-shape invariants grep cannot reach — off-commit-path sweep directives (issue #142) and author-time sub-agent attestations (issue #272) recorded into the receipt.
author: governance-kit

# These directives need an LLM in the loop, so they are not in minimal/standard
# (which must run with no model). They are opt-in via the strict preset (or named
# explicitly). The sweep directives (surface: sweep) never gate a commit; enabling
# them also installs the scheduled governance-sweep workflow + the vendored engine.
# layer-boundaries (surface: change-set) gates on the commit path: it demands a
# recorded sub-agent verdict via the remediation loop, but never spawns anything.
presets:
  strict:
    directives:
      - no-legacy-fallbacks
      - no-path-bifurcation
      - layer-boundaries
