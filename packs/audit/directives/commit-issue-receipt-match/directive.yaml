# commit-issue-receipt-match — a completed change set adds or updates a
# receipts/issue-<N>.md; the receipt path is the issue anchor (file-first).
category: AgentDiscipline
recommended: true
summary: A completed change (PR aggregate or direct-to-default commit) adds or updates a receipts/issue-<N>.md. Intermediate commits do not each require a receipt edit.
surface: change-set
hook: commit-msg
triggers: [commit-msg, schedule]
config:
  - name: RECEIPTS_DIR
    type: scalar
    doc: Fixed directory holding identity-bearing per-issue receipts.
    default: receipts
    tunable: false
  - name: ISSUE_RECEIPT_GLOB
    type: scalar
    doc: Fixed identity-bearing receipt filename glob within RECEIPTS_DIR.
    default: issue-*.md
    tunable: false
  - name: SCHEDULE_CMD
    type: scalar
    doc: Consumer-selected CLI command used for scheduled adjudication.
    default: claude -p --output-format text --model opus
    tunable: true
  - name: SCHEDULE_CRON
    type: scalar
    doc: Consumer-selected cron cadence; empty disables scheduled enrollment.
    default: ""
    tunable: true
judge:
  inputs: [range-diff]
  checks:
    - "The change set's receipt plausibly corresponds to the actual completed change — not a trivial whitespace edit made only to satisfy the check."
    - "The receipt named by the change is genuinely the issue the work belongs to, not an arbitrary unrelated receipt touched to pass the gate."
    - "When a change spans work for more than one issue, only one receipt's issue is the one this change's substance actually belongs to."
    - "A completed change that legitimately has no receipt (a release, an unusual cross-cutting refactor) carries a waiver whose reason genuinely explains the exception, not a boilerplate string."
