# Defaults for agent-steering-accounting. Pack-owned and live — `governance
# pack update` refreshes this file, so improved defaults reach every consumer.
# Do not hand-edit it; customize per-repo via the overlay at
# `.governance/conf/governance-kit/audit/agent-steering-accounting.conf`.
#
# Two knobs are tunable, neither of which affects the check.sh contract — they
# only shape which events the stamping path records:
#
#   * the lexical redirect-trigger phrases (the bare rows below), and
#   * the CANDIDATE_MAX_LEN scalar (the `KEY=value` row at the bottom).
#
# Lexical phrases — overlay syntax:
#   <phrase>      a bare line ADDS a redirect-trigger phrase
#   !<phrase>     drops one of the defaults below (gitignore-style negation)
#
# These phrases drive the HIGH-PRECISION LEXICAL FALLBACK only — the silent
# tier-2 path used when the classifier CLI is unreachable. Under normal
# operation the CLI classifier subsumes this list, so tuning it changes
# behavior only on CLI-down runs. A user message whose first words match any
# phrase (case-insensitive, anchored at the start, on a word boundary) is
# counted as a redirect. Multi-word phrases are matched verbatim.
#
# Example overlay lines (these live in your overlay, not here):
#   scratch that         # also treat "scratch that ..." as a redirect
#   rather               # ...and "rather, do X"
#   !back up             # stop counting "back up" as a redirect trigger
no
stop
wait
actually
instead
don't
hold on
back up
undo
revert
that's wrong
you're wrong

# CANDIDATE_MAX_LEN — the maximum user-message length (chars) still considered a
# classification candidate; longer messages are clipped before the CLI call.
# Raising it widens what the classifier inspects at some token cost; lowering it
# skips long messages. Override per-repo with a `CANDIDATE_MAX_LEN=` line in the
# overlay, or the GOVERNANCE_CANDIDATE_MAX_LEN env var (which wins). The value
# below *is* the live default.
CANDIDATE_MAX_LEN=2000
