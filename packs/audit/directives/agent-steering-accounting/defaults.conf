# Default lexical redirect-trigger phrases for agent-steering-accounting.
# Pack-owned and live — `governance pack update` refreshes this file. Do not
# edit it; customize via the overlay at
# `.governance/conf/agent-steering-accounting.conf` (add a phrase on its own
# line, or `!<phrase>` to drop one of these defaults).
#
# These phrases drive the HIGH-PRECISION LEXICAL FALLBACK only — the silent
# tier-2 path used when the classifier CLI is unreachable. Under normal
# operation the CLI classifier subsumes this list, so tuning it changes
# behavior only on CLI-down runs. A user message whose first words match any
# phrase (case-insensitive, anchored at the start, on a word boundary) is
# counted as a redirect. Multi-word phrases are matched verbatim.
no
stop
wait
actually
instead
don't
hold on
back up
undo
revert
that's wrong
you're wrong
