# agent-steering-accounting — Detected human steering events recorded in the issue's receipt (## Accounting → ### Steering), summarised by per-commit Steer-Count/Types/Tiers trailers.
category: AgentDiscipline
recommended: true
always_install: true
summary: Per-issue steering ledger (interrupts and classifier-confirmed corrections) homed in receipts/issue-<N>.md under ## Accounting; per-commit summary trailers (Steer-Count/Types/Tiers) tally the rows added by each commit.
surface: change-set
hook: commit-msg
reads:
  - receipts/*.md
writes:
  - receipts/*.md
