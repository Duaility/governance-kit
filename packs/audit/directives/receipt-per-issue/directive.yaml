# receipt-per-issue — one unique issue receipt per work item; completed changes
# carry outcome + verification evidence. A recorded fence or verdict is not
# proof that a command ran.
category: AgentDiscipline
recommended: true
summary: Every tracked receipts/*.md has a unique issue-<N> filename; a completed change's receipt records outcome (What changed) and verification evidence. Session stubs cannot satisfy a completed change. Independent review remains required.
surface: repo-state
hook: pre-commit
triggers: [pre-commit, schedule]
config:
  - name: RECEIPTS_DIR
    type: scalar
    doc: Fixed directory holding identity-bearing per-issue receipts.
    default: receipts
    tunable: false
  - name: RECEIPT_FILENAME_REGEX
    type: scalar
    doc: Filename convention — issue-<N>.md or optional kebab-case slug.
    default: '^issue-([0-9]+)(-[a-z0-9]+(-[a-z0-9]+)*)?\.md$'
    tunable: false
  - name: COMPLETED_SECTIONS
    type: list
    doc: Sections required on a non-stub receipt at the completed-change boundary.
    default:
      - What changed
      - Verification
    tunable: false
  - name: ATTEST_SECTION
    type: scalar
    doc: Receipt section where the correspondence audit verdict is recorded.
    default: Audit
    tunable: false
  - name: ATTEST_CMD
    type: scalar
    doc: Judge command for live attestation; harness uses the current session sub-agent.
    default: harness
    tunable: false
  - name: JUDGE_ROUNDS
    type: scalar
    doc: Maximum adjudication rounds before the verdict gate stops retrying.
    default: 3
    tunable: true
  - name: SCHEDULE_EVIDENCE
    type: scalar
    doc: Evidence grain for scheduled re-adjudication; receipts require per-commit intent.
    default: commits
    tunable: false
  - name: SCHEDULE_CMD
    type: scalar
    doc: Consumer-selected CLI command used for scheduled adjudication.
    default: claude -p --output-format text --model opus
    tunable: true
  - name: SCHEDULE_CRON
    type: scalar
    doc: Consumer-selected cron cadence; empty disables scheduled enrollment.
    default: ""
    tunable: true
# Independent review (issue #370): outcome claims and verification evidence
# against the real diff and work item. A recorded verdict is not proof of execution.
judge:
  inputs:  [diff, receipt, issue]
  checks:
    - "'## What changed' faithfully describes the outcome and significant behavior of the diff (no misrepresentation, no omission of significant behavior)"
    - "verification evidence, if taken as true, would support the claimed outcome; a recorded fence or verdict is not proof that execution occurred"
    - "applicable acceptance criteria from the work item are met by the diff, or remaining gaps are named under Decisions/limitations"
