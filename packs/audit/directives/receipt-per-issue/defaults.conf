# Operator-tunable knobs for receipt-per-issue's `## Audit` sub-agent
# attestation (issue #331). These are the OPERATIONAL half of the
# directive.yaml `judge:` block — pure cost dials you may override per-repo
# via the overlay at
# `.governance/conf/governance-kit/audit/receipt-per-issue.conf`. The SEMANTIC
# half (inputs, checks, section) stays author-fixed in directive.yaml: editing
# the vendored directive.yaml trips managed-tree-integrity by design, because
# the sweep lane re-derives the verdict against exactly those fields.
#
# The adjudication round ceiling (JUDGE_ROUNDS) is the per-directive dial that
# lives here. The batching partition — which directives, if any, share one
# judge call with this one — is a repo-level concept and does NOT live in this
# overlay; it lives in the committed `.governance/conf/repo.conf`
# (`judge-group` / `judge-solo` lines, issue #355). See JUDGE.md.
#
# Pack-owned and live — `governance pack update` refreshes this file. Do not
# hand-edit it; write your overrides in the overlay above. Resolution precedence
# (conf_get): env GOVERNANCE_<KEY> > overlay row > this defaults row > the
# directive.yaml value. Until you write an overlay row, behavior is identical to
# the directive.yaml declaration.

