# Operator-tunable knobs for receipt-per-issue's `## Audit` sub-agent
# attestation (issue #331). These are the OPERATIONAL half of the
# directive.yaml `judge:` block — pure cost / batching dials you may override
# per-repo via the overlay at
# `.governance/conf/governance-kit/audit/receipt-per-issue.conf`. The SEMANTIC
# half (inputs, checks, section) stays author-fixed in directive.yaml: editing
