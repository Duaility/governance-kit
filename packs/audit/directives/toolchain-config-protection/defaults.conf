# Default protected-config patterns for toolchain-config-protection.
# Pack-owned and live — `governance pack update` refreshes this file. Do not
# edit it; customize via the overlay at
# `.governance/conf/toolchain-config-protection.conf` (add a pattern on its own
# line, or `!<pattern>` to stop protecting one of these defaults).
#
# Matching: a trailing `/` means directory prefix, a pattern containing `/` is
# matched against the full path, otherwise it matches the basename. Irrelevant
# patterns simply never match, so a Python-only repo pays nothing for the
# JavaScript entries.
.github/workflows/
.githooks/
.eslintrc
.eslintrc.*
eslint.config.*
biome.json
biome.jsonc
.prettierrc
.prettierrc.*
prettier.config.*
tsconfig.json
tsconfig.*.json
ruff.toml
.ruff.toml
pyproject.toml
setup.cfg
.flake8
tox.ini
