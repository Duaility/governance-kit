# .governance/conf/toolchain-config-protection.conf
#
# Your overlay for the `toolchain-config-protection` directive. It layers on top
# of the pack-owned default pattern list (see the directive's defaults.conf:
# CI workflows, git hooks, eslint/prettier/biome, tsconfig, ruff/flake8/
# pyproject, golangci, clippy/rustfmt, pre-commit, lefthook, editorconfig,
# Makefile).
#
#   <pattern>     a bare line ADDS a protected pattern
#   !<pattern>    stops protecting one of the defaults (gitignore-style negation)
#
# Match rules: a trailing `/` is a directory prefix, a pattern containing `/`
# matches the full path, otherwise it matches the basename.
#
# This file is yours — `governance pack update` never overwrites it. Deleting it
# falls back to the stock defaults.
#
# Examples (uncomment to use):
#
# config/ci/*.yml      # also protect your custom CI fragments
# .npmrc               # also protect the npm config
# !Makefile            # stop requiring a waiver for Makefile edits
