# .governance/conf/agent-token-accounting.conf
#
# Per-repo model price overrides for the `agent-token-accounting` directive.
# Each row is:
#
#   rate <model> <base_input> <cache_create> <cache_read> <output>
#
# All four prices are per-million-tokens (MTok), in USD, matching the pack-owned
# default rate card's (base_input, cache_create_5m, cache_read, output) shape —
# the same `rate` row format as `defaults.conf`. Blank lines and lines starting
# with '#' are ignored. Every non-comment line MUST start with `rate` — a
# malformed row fails the commit rather than mispricing it.
#
# Overrides MERGE OVER the pack-owned default rate card (defaults.conf): a row
# here adds a new model or corrects a price without editing defaults.conf (which
# a `governance pack update` refreshes). Model matching is the same as the
# defaults: case-insensitive, trailing API date suffix stripped, exact match
# first then longest-prefix — so `rate claude-opus 4 5 0.4 20` acts as a family
# fallback while a more specific default version row still wins.
#
# Examples (uncomment and set your own numbers):
#
# A brand-new model not in the default rate card:
# rate my-org-llm-v1 3.00 3.75 0.30 15.00
#
# Negotiated/discounted pricing for an existing model (overrides the default):
# rate claude-sonnet-4-6 2.40 3.00 0.24 12.00
