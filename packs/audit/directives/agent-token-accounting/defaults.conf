# agent-token-accounting — pack-owned defaults.
#
# This file ships with NO live rows. It is deliberately doc-only, and that is
# the whole point of the v5 posture (issue #355):
#
#   The kit does not price anything.
#
# Up to v4 this file was a rate card — a `rate <model> <base> <cache_create>
# <cache_read> <output>` row per model, in USD per million tokens, which the
# commit hook multiplied against the transcript to fill the row's `cost-usd`
# cell. Every one of those numbers was a guess about someone else's billing,
# hand-maintained, silently stale the day a vendor changed a price, and it
# could BLOCK a commit when a new model had no row.
#
# From v5, `cost-usd` is whatever the runtime harness itself reported, copied
# verbatim, and EMPTY when the harness reported nothing. The `source` column
# names the adapter the figure came from. A blank cost cell is the honest
# answer; an estimated one to four decimal places is a fabrication that reads
# like a fact. Nothing in this directive can block a commit over pricing any
# more, because nothing in it prices.
#
# If you want dollars for a harness that doesn't report them, teach the
# ADAPTER (`runtimes/<harness>.sh`) to surface the harness's own figure — do
# not reintroduce a rate table here. If you want a rough spend estimate for a
# report, do that in your reporting layer, over the token columns, where it is
# visibly an estimate.
#
# The user overlay for this directive lives at
# `.governance/conf/governance-kit/audit/agent-token-accounting.conf` and
# survives `governance pack update`. It currently has no knobs to set; a stray
# row here or there is simply unread.
