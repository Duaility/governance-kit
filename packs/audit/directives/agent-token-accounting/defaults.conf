# agent-token-accounting — pack-owned defaults.
#
# Two things this file deliberately does NOT contain, and one knob it does.
#
# No rate card. Up to v4 this file was one — a `rate <model> <base>
# <cache_create> <cache_read> <output>` row per model, in USD per million
# tokens, which the commit hook multiplied against the transcript to fill the
# row's `cost-usd` cell. Every one of those numbers was a guess about someone
# else's billing, hand-maintained, silently stale the day a vendor changed a
# price, and it could BLOCK a commit when a new model had no row. From v5
# `cost-usd` is whatever the harness itself reported, copied verbatim, and `-`
# when it reported nothing. A blank cost is the honest answer; an estimate to
# four decimal places is a fabrication that reads like a fact. If you want
# dollars for a harness that doesn't report them, teach the ADAPTER
# (`.governance/runtimes/<harness>.sh`) to surface the harness's own figure —
# do not reintroduce a rate table here. If you want a rough spend estimate for
# a report, do it in your reporting layer, over the token columns, where it is
# visibly an estimate.
#
# No detection heuristics. Issue #355 removed every "newest file wins" /
# mtime fallback from the identity path, and there is no knob to bring one
# back. The kit never guesses which session is committing: a guessed session
# id silently bills one agent's spend to another, which is worse than a blank.
# No identity means no numbers, and the row says so.
#
# Pack-owned and live — `governance pack update` refreshes this file. Do not
# hand-edit it; write overrides in the user overlay at
# `.governance/conf/governance-kit/audit/agent-token-accounting.conf`, which
# survives updates. Resolution precedence (conf_get): env GOVERNANCE_<KEY> >
# overlay row > the defaults row below.

# COSTS_IDENTITY_MAX_AGE_HOURS — how long the kit-owned identity file at
#   `<git-dir>/governance/session-identity` is trusted, in whole hours.
#
#   The identity file is how a harness that exports nothing to its child
#   processes (grok, and any harness wired through a SessionStart-style hook)
#   still gets identified at commit time: its hook writes harness / session /
#   declared / epoch, and the commit path reads them when no environment
#   signal matched. Because it is a file rather than a live environment, it can
#   outlive the session that wrote it — a stale one would attribute today's
#   commit to last week's session.
#
#   The window is the trade: long enough to cover a real working session
#   (including a machine that slept overnight mid-task), short enough that a
#   forgotten file expires rather than misattributes. Past the window the file
#   is ignored entirely and, with no environment signal either, the commit is
#   treated as having no agent runtime at all. Shorten it if your sessions are
#   short and you would rather see an unaccounted commit than a misattributed
#   one; lengthen it for long-running agents on a wired harness.
#
#   An environment signal always beats the identity file, so this knob only
#   governs the fallback path (and the file's ability to fill in a session id
#   the environment left blank for the SAME harness).
COSTS_IDENTITY_MAX_AGE_HOURS=24
