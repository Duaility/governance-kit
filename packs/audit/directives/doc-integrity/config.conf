# .governance/conf/doc-integrity.conf
#
# Your overlay for the `doc-integrity` directive. It layers on top of the
# pack-owned default rules (see the directive's defaults.conf):
#
#   frozen-files    receipts/*.md      (accounting history lives here now)
#   frozen-files    COSTS.md           (sealed legacy ledger; no-op if absent)
#   frozen-files    STEERING.md        (sealed legacy ledger; no-op if absent)
#   frozen-section  QUALITY.md         Resolved
#   frozen-section  CONSTITUTION.md    Evolution Log
#
# Overlay syntax:
#   <mode> <path> [arg]      a bare line ADDS a rule
#   !<mode> <path> [arg]     drops one of the defaults (must match it exactly)
#
# Rule modes:
#   frozen-files    <glob>            files matching <glob> are byte-immutable;
#                                     new files may still be added.
#   append-only     <file>           the baseline version must stay a byte-prefix
#                                     of the current version (only appends).
#   frozen-section  <file> <heading>  baseline lines under `## <heading>` must
#                                     survive verbatim; the rest of the file is
#                                     free.
#
# Integrity is measured against the change set's baseline (the default-branch
# merge-base). Path-scoped waiver for a reviewed rewrite: put
# `governance: allow-doc-integrity <path> <reason>` in the commit body.
#
# This file is yours — `governance pack update` never overwrites it. Deleting it
# falls back to the stock defaults.
#
# Examples (uncomment to use):
#
# append-only     docs/DECISIONS.md    # treat your decision log as append-only
# !frozen-files   COSTS.md             # stop sealing the legacy COSTS.md ledger
