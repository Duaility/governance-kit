# governance-kit audit pack
#
# A trustworthy record of agent work — the full chain plus the protection that
# keeps it tamper-proof:
#   * traceability — every unit of work is a tracked issue with a durable
#     template (`issue-templates`), logged in `QUALITY.md` (`issues-tracked`),
#     lands exactly one receipt (`receipt-per-issue`), and is referenced by the
#     commit that closes it (`commit-issue-receipt-match`);
#   * accounting — every agent-authored commit records what it spent
#     (`agent-token-accounting` → COSTS.md) and every human correction it took
#     (`agent-steering-accounting` → STEERING.md);
#   * integrity — those records stay honest: receipts are immutable, ledgers
#     append-only, frozen sections verbatim (`doc-integrity`), and the toolchain
#     config can't be quietly changed to game a check (`toolchain-config-protection`).
#
# `agent-steering-accounting` and `doc-integrity` are mandatory
# (`always_install: true`): in this kit's model every commit is agent-authored,
# so the provenance trail and its tamper-protection are part of the baseline,
# not an extra. Steering events are recorded by a fresh-context sub-agent
# (a `subagent:` attestation handed the session transcript — no in-hook
# `claude -p`, issue #325); the receipt rows carry operator-intent text, so
# weigh leakage before a public repo rather than skipping the directive.
#
# Directive metadata lives inside each directive's folder under
# `directives/<id>/`. Presets are per-pack and unioned at init.

id: governance-kit/audit
name: Agent audit-chain governance directives
version: "0.7.0"
# Floor 0.12.0 (#343): the subagent tiers/isolation conf overlay (#333) is
# resolved by kit-owned lib.sh/sweep.py — `subagent_attest` reads
# `SUBAGENT_ISOLATION` and the attest/sweep tiers via `conf_get`. Those helpers
# first SHIP to consumers in kit/v0.12.0, so a consumer on an older kit would
# silently ignore the overlay rows. This supersedes the earlier 0.10.0 floor
# (#272/#319: the sub-agent-attestation helpers `require_attestation`,
# `attestation_prompt`, `extract_md_section` first shipped in kit/v0.10.0).
# The floor is always the first-shipped version, not the source line. See
# kit/references/LIB_API.md.
min_governance_kit: "0.12.0"
description: A trustworthy record of agent work — issue → receipt → commit → cost → steering, kept tamper-proof.
author: governance-kit

presets:
  standard:
    directives:
      - issue-templates
      - issues-tracked
      - receipt-per-issue
      - commit-issue-receipt-match
      - agent-token-accounting
      - agent-steering-accounting
      - doc-integrity
      - toolchain-config-protection
  strict:
    extends: standard
    directives: []
