# governance-kit audit pack — the one bundled pack.
#
# Four primitives, always installed, no presets:
#   * managed-tree-integrity — the vendored .governance/ tree is honest
#   * commit-message-format — Conventional Commits subject with a trailing (#N)
#   * receipt-per-issue — unique receipts; a completed change has outcome +
#     evidence and is associated with a receipt file
#   * doc-integrity — receipts and the Evolution Log freeze on the trunk
#
# GitHub issue forms, toolchain-config waivers, and extra freeze rules are
# community/repo-local concerns (issue #370). Session identifiers are a
# harness trailer, not a kit rule.
#
# Version is written only by scripts/release.sh.

id: governance-kit/audit
name: Governance kit
version: "0.11.0"
# Floor 0.13.0 (#355). Directives declare judge: blocks resolved by kit-owned
# lib.sh/schedule.sh — first shipped to consumers in kit/v0.13.0. See
# kit/references/LIB_API.md.
min_governance_kit: "0.13.0"
description: Executable constitution plus receipts — managed tree, commit subject, completed-change attestation, frozen record.
author: governance-kit
