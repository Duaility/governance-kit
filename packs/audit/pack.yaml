# governance-kit audit pack
#
# The agent accounting ledgers: every agent-authored commit records what it
# spent (token-accounting → COSTS.md) and every human correction it took
# (steering-accounting → STEERING.md). Both bundle into `standard`.
# `agent-steering-accounting` is mandatory (`always_install: true`): in this
# kit's model every commit is agent-authored, so durable provenance includes
# every human correction event alongside token-spend. STEERING.md captures
# verbatim operator text — repos that need redaction layer that on top via the
# directive's classifier hook rather than by skipping the directive.
#
# The issue → receipt → commit traceability that used to share this pack now
# lives in `governance-kit/process`, so each pack maps to a single concern.
#
# Directive metadata lives inside each directive's folder under
# `directives/<id>/`. Presets are per-pack and unioned at init.

id: governance-kit/audit
name: Agent audit-chain governance directives
version: "0.1.0"
min_governance_kit: "0.3"
description: Agent accounting ledgers — token-spend (COSTS.md) and steering (STEERING.md).
author: governance-kit

presets:
  standard:
    directives:
      - agent-token-accounting
      - agent-steering-accounting
  strict:
    extends: standard
    directives: []
