# governance-kit audit pack
#
# A trustworthy record of agent work — the full chain plus the protection that
# keeps it tamper-proof:
#   * traceability — every unit of work is a tracked issue with a durable
#     template (`issue-templates`), logged in `QUALITY.md` (`issues-tracked`),
#     lands exactly one receipt (`receipt-per-issue`), and is referenced by the
#     commit that closes it (`commit-issue-receipt-match`);
#   * provenance — every agent-authored commit records the harness/session
#     identifier that produced it in the issue receipt (`agent-session-identity`);
#   * integrity — those records stay honest: receipts are immutable, ledgers
#     append-only, frozen sections verbatim (`doc-integrity`), and the toolchain
#     config can't be quietly changed to game a check (`toolchain-config-protection`).
#
# `agent-session-identity` and `doc-integrity` are mandatory
# (`always_install: true`): in this kit's model every commit is agent-authored,
# so the provenance trail and its tamper-protection are part of the baseline,
# not an extra. The identity directive records only explicit harness/session
# signals and never reads conversation history or harness-owned state.
#
# Directive metadata lives inside each directive's folder under
# `directives/<id>/`. Presets are per-pack and unioned at init.

id: governance-kit/audit
name: Agent audit-chain governance directives
version: "0.9.0"
# Floor 0.13.0 (#355), raised from 0.12.0 (#343). This pack's
# directives declare `judge:` blocks resolved by kit-owned lib.sh/schedule.sh —
# `judge_attest`, the `cmd`/three-valued-`gate` schema, and the independent
# remediation orchestrator. Those helpers first shipped to consumers in
# kit/v0.13.0, so this floor moved with the release commit; a
# feature PR cannot raise it because kit-version-consistency requires floor
# <= the current kit.yaml version. It supersedes the earlier 0.10.0 floor
# (#272/#319: `require_attestation`,
# `attestation_prompt`, `extract_md_section` first shipped in kit/v0.10.0).
# The floor is always the first-shipped version, not the source line. See
# kit/references/LIB_API.md.
min_governance_kit: "0.13.0"
description: A trustworthy record of agent work — issue → receipt → commit → session identity, kept tamper-proof.
author: governance-kit

presets:
  standard:
    directives:
      - issue-templates
      - issues-tracked
      - receipt-per-issue
      - commit-issue-receipt-match
      - agent-session-identity
      - doc-integrity
      - toolchain-config-protection
  strict:
    extends: standard
    directives: []
