# .governance/conf/commit-message-format.conf
#
# Your overlay for the `commit-message-format` directive. It layers on top of
# the pack-owned default type list (see the directive's defaults.conf:
# feat, fix, chore, docs, refactor, test, perf, build, ci, revert, style).
#
#   <type>     a bare line ADDS an allowed Conventional-Commit type
#   !<type>    removes one of the default types (gitignore-style negation)
#
# This file is yours — `governance pack update` never overwrites it. Deleting it
# falls back to the stock defaults.
#
# Examples (uncomment to use):
#
# wip          # also allow `wip:` commits
# hotfix       # also allow `hotfix:` commits
# !style       # disallow `style:` commits
