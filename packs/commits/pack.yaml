# governance-kit commits pack
#
# Commit-message format: Conventional Commit subjects with a trailing GitHub
# issue reference. TODO/FIXME and suppression-to-ticket rules are not bundled
# (issue #370); ecosystem tooling and ordinary review own those concerns.
# Nothing in this pack belongs to `minimal` — these are the rules a repo opts
# into once it is past bootstrap. `strict` extends `standard` with no extra
# directives; the preset interface is retained even though the tiers currently
# resolve to the same set.
# RELEASE REMINDER: if these directives begin requiring a newer kit runtime,
# raise min_governance_kit in the release commit that first ships that runtime.
# Version is written only by scripts/release.sh.
#
# Directive metadata lives inside each directive's folder under
# `directives/<id>/`. Presets are per-pack and unioned at init.

id: governance-kit/commits
name: Commit hygiene governance directives
version: "0.4.0"
min_governance_kit: "0.6.0"
description: Commit-message format with a trailing GitHub issue reference.
author: governance-kit

presets:
  standard:
    directives:
      - commit-message-format
  strict:
    extends: standard
    directives: []
