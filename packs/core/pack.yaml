# governance-kit core pack
#
# Built-in directives that ship with governance-bootstrap. Every repo that
# bootstraps governance gets at least the directives listed in
# `presets.minimal` from this pack — the `core` pack cannot be
# deselected by users.
#
# Directive metadata lives inside each directive's folder under
# `directives/<id>/` — `directive.yaml` (category / recommended / summary /
# surface / hook / always_install), `check.sh`, `constitution.md`, and
# optional `evals/`. This file carries only pack-level identity and the
# presets that select directives by id.
#
# The `standard` preset bundles the agent audit chain
# (issue → receipt → commit → cost → steering). Each link is enforced
# by a separate directive; breaking any link fails the next push.
# `agent-steering-accounting` is mandatory (`always_install: true`,
# matching `repo-hygiene`): in this kit's model every commit is
# agent-authored, so durable provenance includes every human
# correction event alongside token-spend. STEERING.md captures
# verbatim operator text — repos that need redaction layer that on
# top via the directive's classifier hook rather than by skipping
# the directive.
#
# `doc-integrity` is also mandatory (`always_install: true`): the audit
# chain's own artifacts (receipts, the COSTS.md / STEERING.md ledgers,
# the resolved-issues log, the constitution's evolution log) are only
# trustworthy as a record if they are append-only, so the integrity
# engine that freezes their history ships on by default. It reads
# `.governance/integrity.conf` (seeded with all standard rules enabled)
# and is a no-op for any document not present.

id: governance-kit/core
name: Core governance directives
version: "0.3.4"
min_governance_kit: "0.3"
description: Baseline directives shipped with governance-kit, including the agent audit chain.
author: governance-kit

presets:
  minimal:
    directives:
      - required-docs
      - secrets-hygiene
      - repo-hygiene
      - workflows-hardened
      - no-broken-internal-doc-links
  standard:
    extends: minimal
    directives:
      - commit-message-format
      - version-consistency
      - doc-freshness
      - issue-templates
      - issues-tracked
      - receipt-per-issue
      - commit-issue-receipt-match
      - doc-integrity
      - agent-token-accounting
      - agent-steering-accounting
  strict:
    extends: standard
    directives:
      - no-orphan-todos
