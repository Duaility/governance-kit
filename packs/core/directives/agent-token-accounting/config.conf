# .governance/conf/agent-token-accounting.conf
#
# Per-repo model price overrides for the `agent-token-accounting` directive.
# Each row is:
#
#   rate <model> <base_input> <cache_create> <cache_read> <output>
#
# All four prices are per-million-tokens (MTok), in USD, matching the built-in
# table's (base_input, cache_create_5m, cache_read, output) shape. Blank lines
# and lines starting with '#' are ignored. Every non-comment line MUST start
# with `rate` — a malformed row fails the commit rather than mispricing it.
#
# Overrides MERGE OVER the built-in price table: a row here adds a new model or
# corrects a price without patching the pack-owned lib/rates.py (which a
# `governance pack update` would clobber). Model matching is the same as the
# built-ins: case-insensitive, trailing API date suffix stripped, exact match
# first then longest-prefix — so `rate claude-opus 4 5 0.4 20` acts as a family
# fallback while a more specific built-in version row still wins.
#
# Examples (uncomment and set your own numbers):
#
# A brand-new model not yet in the built-in table:
# rate my-org-llm-v1 3.00 3.75 0.30 15.00
#
# Negotiated/discounted pricing for an existing model (overrides the built-in):
# rate claude-sonnet-4-6 2.40 3.00 0.24 12.00
