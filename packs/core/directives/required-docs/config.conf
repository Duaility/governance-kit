# .governance/conf/required-docs.conf
#
# Threshold tuning for the `required-docs` directive. `KEY=value` lines set a
# scalar; blank lines and lines starting with '#' are ignored. Each key can also
# be overridden by the matching `GOVERNANCE_<KEY>` environment variable, which
# wins over this file.
#
#   AGENTS_MD_MIN         Minimum line count for AGENTS.md (stub guard). Default 30.
#   AGENTS_MD_MAX         Maximum line count for AGENTS.md (keep it an index, not a
#                         manual). Default 250.
#   AGENTS_MD_MIN_LINKS   Minimum internal links AGENTS.md must carry. Default 3.
#   ARCHITECTURE_MIN      Minimum line count for ARCHITECTURE.md. Default 20.
#
# Examples (uncomment to change):
# AGENTS_MD_MIN=40
# AGENTS_MD_MAX=300
# AGENTS_MD_MIN_LINKS=5
# ARCHITECTURE_MIN=30
