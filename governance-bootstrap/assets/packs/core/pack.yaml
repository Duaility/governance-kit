# governance-kit core pack
#
# Built-in rules that ship with governance-bootstrap. Every repo that
# bootstraps governance gets at least the rules listed in
# `presets.minimal` from this pack — the `core` pack cannot be
# deselected by users.
#
# Field reference:
#   id              — filename without .sh; must be unique across all packs
#                     installed into a single target repo
#   category        — menu grouping; canonical values are Foundation,
#                     Security, SystemOfRecord, CommitHygiene, Quality
#   recommended     — pre-checked in the menu; presets.<name> lists may
#                     override this per preset
#   summary         — one-line description shown in the picker
#   script          — relative path to the rule's .sh inside this pack
#   constitution    — relative path to the Invariant-subsection snippet
#                     copied into CONSTITUTION.md at install
#   surface         — repo-state | change-set — documents whether the
#                     rule checks repo state at rest or a per-change
#                     obligation
#   hook            — pre-commit | commit-msg | prepare-commit-msg | none
#                     — hook generator uses this to decide which
#                     dispatcher to emit
#   always_install  — true ⇒ bypass the menu; reserved to `core`

id: core
name: Core governance rules
version: "0.1"
min_governance_kit: "0.1"
description: Baseline rules shipped with governance-kit.
author: governance-kit

presets:
  minimal:
    rules:
      - constitution-exists
      - no-secrets
      - dotenv-gitignored
      - workflows-hardened
      - no-broken-internal-doc-links
      - no-large-files
      - no-committed-build-artifacts
      - no-merge-conflict-markers
      - hooks-configured
  standard:
    extends: minimal
    rules:
      - agents-md-exists
      - conventional-commits
      - doc-freshness
  strict:
    extends: standard
    rules:
      - readme-exists
      - security-md-exists
      - architecture-doc-exists
      - ci-workflow-exists
      - no-orphan-todos
      - file-size-limit
      - no-debug-statements

rules:
  # ─── Foundation ─────────────────────────────────────────────
  - id: constitution-exists
    category: Foundation
    recommended: true
    summary: CONSTITUTION.md exists, non-empty, >= 10 lines.
    script: rules/constitution-exists.sh
    constitution: constitution-snippets/constitution-exists.md
    surface: repo-state
    hook: pre-commit

  - id: readme-exists
    category: Foundation
    recommended: false
    summary: README.md (or .rst) exists with a heading and >= 30 words.
    script: rules/readme-exists.sh
    constitution: constitution-snippets/readme-exists.md
    surface: repo-state
    hook: pre-commit

  - id: license-exists
    category: Foundation
    recommended: false
    summary: A LICENSE (or variant) exists at the repo root.
    script: rules/license-exists.sh
    constitution: constitution-snippets/license-exists.md
    surface: repo-state
    hook: pre-commit

  - id: agents-md-exists
    category: Foundation
    recommended: true
    summary: AGENTS.md exists at root, 30-250 lines, with >= 3 doc links.
    script: rules/agents-md-exists.sh
    constitution: constitution-snippets/agents-md-exists.md
    surface: repo-state
    hook: pre-commit

  # ─── Security ───────────────────────────────────────────────
  - id: no-secrets
    category: Security
    recommended: true
    summary: Heuristic scan for AWS / GCP / GitHub / Slack / Stripe / private-key patterns.
    script: rules/no-secrets.sh
    constitution: constitution-snippets/no-secrets.md
    surface: repo-state
    hook: pre-commit

  - id: dotenv-gitignored
    category: Security
    recommended: true
    summary: .env is listed in .gitignore and not tracked.
    script: rules/dotenv-gitignored.sh
    constitution: constitution-snippets/dotenv-gitignored.md
    surface: repo-state
    hook: pre-commit

  - id: security-md-exists
    category: Security
    recommended: false
    summary: SECURITY.md (root / docs/ / .github/) with a contact email or URL.
    script: rules/security-md-exists.sh
    constitution: constitution-snippets/security-md-exists.md
    surface: repo-state
    hook: pre-commit

  - id: workflows-hardened
    category: Security
    recommended: true
    summary: GitHub Actions workflows declare permissions and pin third-party actions to a SHA.
    script: rules/workflows-hardened.sh
    constitution: constitution-snippets/workflows-hardened.md
    surface: repo-state
    hook: pre-commit

  # ─── System of record ───────────────────────────────────────
  - id: architecture-doc-exists
    category: SystemOfRecord
    recommended: false
    summary: ARCHITECTURE.md (root or docs/) exists and is >= 20 lines.
    script: rules/architecture-doc-exists.sh
    constitution: constitution-snippets/architecture-doc-exists.md
    surface: repo-state
    hook: pre-commit

  - id: no-broken-internal-doc-links
    category: SystemOfRecord
    recommended: true
    summary: Markdown links to local paths resolve.
    script: rules/no-broken-internal-doc-links.sh
    constitution: constitution-snippets/no-broken-internal-doc-links.md
    surface: repo-state
    hook: pre-commit

  - id: doc-freshness
    category: SystemOfRecord
    recommended: false
    summary: Opted-in docs carry a <!-- last-verified: YYYY-MM-DD --> marker within 90 days.
    script: rules/doc-freshness.sh
    constitution: constitution-snippets/doc-freshness.md
    surface: repo-state
    hook: pre-commit

  - id: ci-workflow-exists
    category: SystemOfRecord
    recommended: false
    summary: At least one non-governance workflow exists under .github/workflows/.
    script: rules/ci-workflow-exists.sh
    constitution: constitution-snippets/ci-workflow-exists.md
    surface: repo-state
    hook: pre-commit

  # ─── Commit hygiene ─────────────────────────────────────────
  - id: conventional-commits
    category: CommitHygiene
    recommended: true
    summary: Commit messages match <type>(scope)?!?: subject (#123).
    script: rules/conventional-commits.sh
    constitution: constitution-snippets/conventional-commits.md
    surface: change-set
    hook: commit-msg

  - id: no-orphan-todos
    category: CommitHygiene
    recommended: false
    summary: Every TODO / FIXME references #123 or ABC-123.
    script: rules/no-orphan-todos.sh
    constitution: constitution-snippets/no-orphan-todos.md
    surface: repo-state
    hook: pre-commit

  # ─── Quality ────────────────────────────────────────────────
  - id: no-debug-statements
    category: Quality
    recommended: false
    summary: No stray console.log / debugger / pdb / dbg! / breakpoint() in source.
    script: rules/no-debug-statements.sh
    constitution: constitution-snippets/no-debug-statements.md
    surface: repo-state
    hook: pre-commit

  - id: file-size-limit
    category: Quality
    recommended: false
    summary: No source file exceeds 500 lines (override via GOVERNANCE_FILE_SIZE_LIMIT).
    script: rules/file-size-limit.sh
    constitution: constitution-snippets/file-size-limit.md
    surface: repo-state
    hook: pre-commit

  - id: no-large-files
    category: Quality
    recommended: true
    summary: No tracked file exceeds 5 MB (override via GOVERNANCE_MAX_FILE_SIZE_MB).
    script: rules/no-large-files.sh
    constitution: constitution-snippets/no-large-files.md
    surface: repo-state
    hook: pre-commit

  - id: no-committed-build-artifacts
    category: Quality
    recommended: true
    summary: No __pycache__ / node_modules / dist / build / target / out / .DS_Store tracked.
    script: rules/no-committed-build-artifacts.sh
    constitution: constitution-snippets/no-committed-build-artifacts.md
    surface: repo-state
    hook: pre-commit

  - id: no-merge-conflict-markers
    category: Quality
    recommended: true
    always_install: true
    summary: No <<<<<<< / ======= / >>>>>>> markers in tracked files.
    script: rules/no-merge-conflict-markers.sh
    constitution: constitution-snippets/no-merge-conflict-markers.md
    surface: repo-state
    hook: pre-commit

  # ─── Meta ───────────────────────────────────────────────────
  - id: hooks-configured
    category: Foundation
    recommended: true
    summary: .githooks/* is tracked + executable and core.hooksPath is set.
    script: rules/hooks-configured.sh
    constitution: constitution-snippets/hooks-configured.md
    surface: repo-state
    hook: pre-commit

  # ─── Also available — not in default menu ───────────────────
  - id: env-example-current
    category: Security
    recommended: false
    summary: Every key in local .env is declared in .env.example.
    script: rules/env-example-current.sh
    constitution: constitution-snippets/env-example-current.md
    surface: repo-state
    hook: pre-commit
