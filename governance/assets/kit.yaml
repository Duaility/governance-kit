# governance-kit — kit (framework) version.
#
# SINGLE SOURCE OF TRUTH for the kit axis. Everything else that carries the kit
# version (governance/SKILL.md frontmatter, .governance/install.yaml kit_version,
# the `kit-version=` markers stamped into managed runtime files) is *derived*
# from this value by scripts/release.sh and verified by the version-consistency
# directive — never hand-edit those copies.
#
# The core pack and community packs version INDEPENDENTLY (see
# packs/core/pack.yaml `version`); they declare `min_governance_kit` to express
# the floor kit they require. See governance/references/VERSIONING.md for the
# semver policy, the axis contract, and the release procedure.
version: "0.3.5"
